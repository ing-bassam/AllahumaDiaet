# Beschreibt das Xcode-Projekt. Daraus erzeugt XcodeGen (auf dem GitHub-Runner) die Datei
# Hachibu.xcodeproj – sie wird nicht eingecheckt, damit es keine Konflikte in der Projektdatei gibt.
name: Hachibu
options:
  bundleIdPrefix: com.abdelkarim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    DEVELOPMENT_TEAM: 93FH42C5BX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "100"
    # Sprachmodus Swift 5: weniger strenge Nebenläufigkeitsprüfung, weniger Überraschungen beim Bauen.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.11.1"

targets:
  Hachibu:
    type: application
    platform: iOS
    sources:
      - path: Hachibu
      - path: Shared
    dependencies:
      - package: GRDB
      - target: HachibuWidget
    entitlements:
      path: Hachibu/Hachibu.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.abdelkarim.hachibu
    info:
      path: Hachibu/Info.plist
      properties:
        CFBundleDisplayName: Hachibu
        CFBundleName: Hachibu
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Die Kamera wird nur zum Scannen von Barcodes auf Lebensmitteln verwendet.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: com.abdelkarim.hachibu
            CFBundleURLSchemes: [hachibu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdelkarim.hachibu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: ""

  HachibuWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HachibuWidget
      - path: Shared
    entitlements:
      path: HachibuWidget/HachibuWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.abdelkarim.hachibu
    info:
      path: HachibuWidget/Info.plist
      properties:
        CFBundleDisplayName: Hachibu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdelkarim.hachibu.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HachibuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HachibuTests
    dependencies:
      - target: Hachibu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdelkarim.hachibu.tests

schemes:
  Hachibu:
    build:
      targets:
        Hachibu: all
        HachibuWidget: all
        HachibuTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HachibuTests
    archive:
      config: Release
