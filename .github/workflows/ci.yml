# Baut die App im Simulator und führt die Tests aus – bei jedem Push und jedem Pull Request.
# Läuft auf einem macOS-Runner von GitHub, deshalb braucht niemand einen eigenen Mac.
name: Bauen und testen

on:
  push:
    branches: [main, swiftui]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fastlane:
    name: fastlane-Datei prüfen (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Syntax von Fastfile und Appfile prüfen
        run: ruby -c fastlane/Fastfile && ruby -c fastlane/Appfile

  test:
    name: Simulator-Build und Tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: brew install xcodegen xcbeautify

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Xcode-Projekt aus project.yml erzeugen
        run: xcodegen generate

      - name: Nur iPhone prüfen
        # Steht hier etwas anderes als 1, lehnt Apple den Upload ab (alle Ausrichtungen fürs iPad nötig).
        run: |
          for target in Hachibu HachibuWidget; do
            fam=$(xcodebuild -project Hachibu.xcodeproj -target "$target" -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '$1 ~ / TARGETED_DEVICE_FAMILY$/ {print $2}')
            echo "$target: TARGETED_DEVICE_FAMILY=$fam"
            if [ "$fam" != "1" ]; then
              echo "::error::$target ist nicht auf 'nur iPhone' gestellt (TARGETED_DEVICE_FAMILY=$fam). Bitte in project.yml beim Target eintragen."
              exit 1
            fi
          done

      - name: Pakete auflösen
        run: xcodebuild -resolvePackageDependencies -project Hachibu.xcodeproj -scheme Hachibu

      - name: Bauen und testen
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Hachibu.xcodeproj \
            -scheme Hachibu \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Protokoll hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build/xcodebuild.log
            build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
