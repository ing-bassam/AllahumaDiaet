# Baut die App signiert und lädt sie zu App Store Connect hoch (erscheint dann in TestFlight).
# Von Hand starten: GitHub → Actions → „App Store Upload“ → Run workflow.
#
# Braucht drei Secrets im Repository (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID des App-Store-Connect-API-Schlüssels (10 Zeichen)
#   ASC_ISSUER_ID   Issuer ID (UUID) aus App Store Connect → Benutzer und Zugriff → Integrationen
#   ASC_KEY_P8      Inhalt der heruntergeladenen .p8-Datei (kompletter Text inkl. BEGIN/END-Zeilen)
#
# Signiert wird mit fastlane (fastlane/Fastfile): Jeder Lauf erzeugt ein Verteilungszertifikat nur für
# sich und widerruft es am Ende wieder. Im Repository liegen weder Zertifikate noch Profile.
name: App Store Upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  upload:
    name: Bauen, signieren, hochladen
    runs-on: macos-26
    # Großzügig, weil der Lauf auf Apples Verarbeitung wartet, bevor er das Zertifikat widerruft.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "$(printf '%s' "${!name}" | tr -d '[:space:]')" ]; then
              echo "::error::Das GitHub Secret $name fehlt (README.md, Abschnitt „Veröffentlichen“)."
              exit 1
            fi
          done
          echo "Alle drei Secrets sind vorhanden."

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Ruby und fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: XcodeGen installieren
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Xcode-Projekt aus project.yml erzeugen
        run: xcodegen generate

      - name: Bauen, signieren und zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_SKIP_DOCS: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
        run: bundle exec fastlane ios beta

      - name: Signierdateien löschen
        if: always()
        run: rm -rf build/signing

      - name: Protokolle sichern (nur bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-protokolle
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 14
