# Baut die App signiert und lädt sie zu App Store Connect hoch (erscheint dann in TestFlight).
# Von Hand starten: GitHub → Actions → "App Store Upload" → Run workflow.
#
# Braucht drei Secrets im Repository (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      Key ID des App-Store-Connect-API-Schlüssels (10 Zeichen)
#   ASC_ISSUER_ID   Issuer ID (UUID) aus App Store Connect → Benutzer und Zugriff → Integrationen
#   ASC_KEY_P8      Inhalt der heruntergeladenen .p8-Datei (kompletter Text inkl. BEGIN/END-Zeilen)
# Der Schlüssel braucht die Rolle "App Manager" oder "Admin". Zertifikat und Profil legt Xcode damit
# selbst an (Cloud-Signierung); nichts davon liegt im Repository.
name: App Store Upload

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  upload:
    name: Archiv bauen und hochladen
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then
            echo "::error::Es fehlen ASC_KEY_ID, ASC_ISSUER_ID oder ASC_KEY_P8 in den Repository-Secrets."
            exit 1
          fi

      - name: Werkzeuge installieren
        run: brew install xcodegen xcbeautify

      - name: Xcode-Projekt aus project.yml erzeugen
        run: xcodegen generate

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build-Nummer festlegen
        # Muss bei jedem Upload größer sein als zuvor. Die Expo-Builds gingen bis 6; ab hier 100 + Laufnummer.
        run: echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Archiv bauen (signiert)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Hachibu.xcodeproj \
            -scheme Hachibu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hachibu.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/archive.log | xcbeautify --renderer github-actions

      - name: Zu App Store Connect hochladen
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -exportArchive \
            -archivePath build/Hachibu.xcarchive \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log | xcbeautify --renderer github-actions
          echo "Hochgeladen: Version $(grep -m1 MARKETING_VERSION project.yml | sed 's/.*: //'), Build $BUILD_NUMBER"

      - name: Schlüssel löschen
        if: always()
        run: rm -rf "$HOME/private_keys"

      - name: Protokolle hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 14
